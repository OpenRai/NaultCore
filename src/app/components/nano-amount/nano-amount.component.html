@if (presentation; as amount) {
  @if (amount.relation === 'invalid' || amount.relation === 'unavailable') {
    <span [attr.aria-label]="unavailableLabel">—</span>
  } @else if (detailsRoute) {
    <a class="amount-link" [routerLink]="detailsRoute"
      [attr.aria-label]="amount.display + ' · ' + detailsLabel"
      [attr.data-relation]="amount.relation" data-testid="nano-amount-summary">{{ amount.display }}</a>
  } @else {
    <span [attr.data-relation]="amount.relation" data-testid="nano-amount-summary">{{ amount.display }}</span>
  }
}
