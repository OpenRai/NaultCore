name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  karma-unit:
    name: Karma Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential libudev-dev libusb-1.0-0-dev
          version: 1.0

      - name: Install dependencies
        env:
          PYTHON: python3.11
        run: pnpm install --frozen-lockfile

      - name: Run Vitest tests
        run: pnpm run test:vitest

      - name: Run NanoNym-enabled Vitest tests
        run: pnpm run test:vitest:nanonyms

      - name: Run Karma tests
        run: |
          CHROME_BIN=$(which chromium-browser || which chromium || echo "") \
          pnpm run test --browsers=ChromeHeadlessNoSandbox

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: karma-unit
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential libudev-dev libusb-1.0-0-dev
          version: 1.0

      - name: Install dependencies
        env:
          PYTHON: python3.11
        run: pnpm install --frozen-lockfile

      # Playwright's bundled Chromium - best practice as of 2025-2026.
      # Installs Chromium binary + all OS-level shared library deps in one step.
      # No need for separate apt installs or google-chrome PPAs.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm run build

      - name: Run Playwright tests
        env:
          NANO_TEST_SEED: ${{ secrets.NANO_TEST_SEED }}
          CI: 'true'
        run: pnpm exec playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
