  <!--
    Declares that both schemes are supported so the browser can theme native UI
    (scrollbars, form controls, the initial canvas) and avoid a flash of the
    wrong theme before Angular boots.
  -->
  <meta name="color-scheme" content="light dark">
  <!-- Single tag, no media query: an explicit in-app override must win over the
       OS preference, and a media-scoped tag would ignore that. -->
  <meta name="theme-color" content="#22222A">
  <style>
    /* The loading shell sits above the app for a moment; it must not paint a
       dark rectangle into a light theme before Angular replaces it. */
    html[data-theme="light"] #app-loading { background-color: #f8f8f8; }
    html[data-theme="light"] #app-loading .app-loading-text { color: #5B5B6B; }
  </style>
  <script>
    // Runs before Angular so the canvas, browser chrome, and loading shell match
    // the stored preference instead of flashing the default. This mirrors
    // ThemeService, which keeps everything in sync once the app is up.
    (function () {
      var scheme = 'light dark';
      try {
        var stored = JSON.parse(localStorage.getItem('nanovault-appsettings') || '{}').appearanceMode;
        if (stored === 'light' || stored === 'dark') { scheme = stored; }
      } catch (e) { /* storage blocked; fall back to following the system */ }
      var resolved = scheme;
      if (scheme === 'light dark') {
        resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.style.colorScheme = resolved;
      document.documentElement.setAttribute('data-theme', resolved);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', resolved === 'dark' ? '#22222A' : '#f8f8f8');
    })();
  </script>
