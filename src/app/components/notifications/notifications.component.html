<div class="notification-container">
  @for (notification of notifications; track notification) {
    <div
      [class]="['uk-alert', notification.cssClass]"
      class="uk-animation-slide-bottom-small wallet-notification"
      (click)="removeNotification(notification)"
      uk-alert
      >
      <a class="uk-alert-close close-notification" uk-close></a>
      <p><span [innerHTML]="notification.message"></span>
        @if (notification.action === 'unlock-wallet') {
          <app-wallet-unlock-link labelKey="wallet-unlock.receive" />
        }
      </p>
    </div>
  }
</div>
